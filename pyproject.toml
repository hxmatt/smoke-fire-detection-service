[project]
name = "smoke-fire-detection-service"
version = "0.1.0"
description = "A service for smoke and fire detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyterlab>=4.5.7",
    "pre-commit>=4.0.0",
    "ruff>=0.15.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [".venv", "uv.lock"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade,
# B: flake8-bugbear, SIM: flake8-simplify, C4: comprehensions
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.format]
docstring-code-format = true
