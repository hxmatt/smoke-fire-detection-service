[project]
name = "smoke-fire-detection-service"
version = "0.1.0"
description = "A service for smoke and fire detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.2",
    "tqdm>=4.67.0",
]

# torch/torchvision: cpu or cu128 wheels, selected per install via extra
[project.optional-dependencies]
cpu = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
]
cu128 = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyterlab>=4.5.7",
    "pre-commit>=4.0.0",
    "ruff>=0.15.0",
]
analysis = [
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "requests>=2.32.0",
    "seaborn>=0.13.2",
    "torchmetrics>=1.4.0",
]
training = [
    "ultralytics>=8.3.0",
    "torchmetrics>=1.4.0",
    "pillow>=10.0.0",
    "faster-coco-eval>=1.7.2",
    "pycocotools>=2.0.11",
]
service = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pillow>=10.0.0",
    "ultralytics>=8.3.0",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [".venv", "uv.lock"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade,
# B: flake8-bugbear, SIM: flake8-simplify, C4: comprehensions
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's File/Form/Depends defaults are the intended pattern, not a bug.
"src/api/*" = ["B008"]

[tool.ruff.format]
docstring-code-format = true
