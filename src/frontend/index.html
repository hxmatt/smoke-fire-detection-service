<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smoke &amp; Fire Detection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d94f1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 2c1 3-1 5-2 7a5 5 0 1 0 9 2c0-2-1-3-1-5 2 1 3 3 3 5a7 7 0 1 1-13-3c1-2 3-3 4-6z"/>
    </svg>
    <strong>Smoke &amp; Fire Detection</strong>
  </header>

  <div class="wrap">

    <!-- controls -->
    <div class="box">
      <div class="row">
        <label for="model">Model</label>
        <select id="model"></select>
      </div>

      <div class="row">
        <div class="conf"><span>Confidence</span><span id="confVal">0.25</span></div>
        <input type="range" id="conf" min="0" max="0.9" step="0.05" value="0.25">
      </div>

      <div class="upload" id="upload">Drop an image or click to browse</div>
      <input type="file" id="file" accept="image/*" hidden>
      <button id="run" disabled>Detect</button>

      <div class="stats">
        <div><span>Time</span><b id="sTime">&ndash;</b></div>
        <div><span>Objects</span><b id="sCount">&ndash;</b></div>
      </div>
    </div>

    <!-- result -->
    <div class="box">
      <div id="view" class="placeholder">No image loaded</div>
      <canvas id="canvas" hidden></canvas>
      <div class="list" id="list"></div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
