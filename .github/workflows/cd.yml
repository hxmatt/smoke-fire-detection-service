name: CD

# Build the image (release weights are bundled in) and push it to GHCR.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the weight assets off the release
      packages: write # push the image to GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Fetch model weights from the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download --dir weights --pattern '*.pt'

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push the image
        run: |
          docker build --platform linux/amd64 -t ghcr.io/hxmatt/smoke-fire-detection-service:latest .
          docker push ghcr.io/hxmatt/smoke-fire-detection-service:latest
